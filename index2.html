<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NB - Mavzulashtirilgan DTM Test Platformasi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #1e3a8a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .container { max-width: 650px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 20px; color: #1e3a8a; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; background: white; }
        button { width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #059669; }
        .hidden { display: none; }
        .question { font-size: 18px; font-weight: 600; margin-bottom: 15px; line-height: 1.5; color: #111827; }
        .options { list-style: none; }
        .options li { margin-bottom: 10px; }
        .options label { display: flex; align-items: center; padding: 12px; background: #f3f4f6; border-radius: 5px; cursor: pointer; transition: 0.2s; font-weight: normal; border: 1px solid #e5e7eb; }
        .options label:hover { background: #e5e7eb; }
        .options input { width: auto; margin-right: 10px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .btn-nav { background-color: #3b82f6; width: 48%; }
        .btn-nav:hover { background-color: #2563eb; }
        .stats { margin-top: 15px; text-align: center; font-size: 14px; color: #666; font-weight: 500; }
        .score { font-size: 48px; color: #10b981; font-weight: bold; margin: 20px 0; text-align: center; }
    </style>
</head>
<body>

<header>
    <div class="logo">NB</div>
    <div id="user-display">Mehmonsiz</div>
</header>

<div class="container">
    <!-- 1. RO'YXATDAN O'TISH VA MAVZU TANLASH BO'LIMI -->
    <div id="auth-box">
        <h2>Ro'yxatdan o'tish</h2>
        <form id="reg-form">
            <div class="form-group">
                <label for="username">Ism va Familiyangiz:</label>
                <input type="text" id="username" required placeholder="Masalan: Ali Valiyev">
            </div>
            <div class="form-group">
                <label for="phone">Telefon raqamingiz:</label>
                <input type="tel" id="phone" required placeholder="Masalan: +998901234567">
            </div>
            <div class="form-group">
                <label for="topic-select">Kategoriyani tanlang (Har birida 100 ta test):</label>
                <select id="topic-select" required>
                    <option value="chiziqli">Chiziqli tenglamalar</option>
                    <option value="kvadrat">Kvadrat tenglamalar</option>
                    <option value="foiz">Foizga oid masalalar</option>
                    <option value="trigonometriya">Trigonometriya</option>
                    <option value="matnli">Matnli masalalar</option>
                    <option value="ildiz">Ildizli ifodalar</option>
                    <option value="kasrlar">Kasrlar va amallar</option>
                    <option value="algebraik">Algebraik ifodalar</option>
                </select>
            </div>
            <button type="submit">Tanlangan mavzuda testni boshlash</button>
        </form>
    </div>

    <!-- 2. TEST YECHISH BO'LIMI -->
    <div id="quiz-box" class="hidden">
        <h2 id="subject-title">DTM Testi</h2>
        <div class="stats" id="progress-text">Savol: 1 / 100</div>
        <div class="question" id="question-text">Savol yuklanmoqda...</div>
        <ul class="options" id="options-list"></ul>
        <div class="nav-buttons">
            <button class="btn-nav" id="prev-btn" onclick="prevQuestion()">Orqaga</button>
            <button class="btn-nav" id="next-btn" onclick="nextQuestion()">Keyingisi</button>
        </div>
        <button style="margin-top: 15px; background-color: #ef4444;" onclick="finishQuiz()">Testni yakunlash</button>
    </div>

    <!-- 3. NATIJA BO'LIMI -->
    <div id="result-box" class="hidden">
        <h2>Sizning natijangiz</h2>
        <div class="score" id="final-score">0 / 100</div>
        <p id="user-summary" style="margin-bottom: 20px; line-height: 1.6; text-align: center;"></p>
        <p id="save-status" style="color: #3b82f6; font-weight: bold; text-align: center; margin-bottom: 15px;">Natija bazaga saqlanmoqda...</p>
        <button onclick="location.reload()">Boshqa mavzuni yechish</button>
    </div>
</div>

<!-- Firebase SDK kutubxonalarini ulash -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc } from "https://gstatic.com";

    // ⚠️ FIREBASE CONFIG KODLARINGIZNI SHU YERGA JOYLASHTIRING:
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeQuestions = [];
    window.currentQuizIndex = 0;
    window.userAnswers = {};
    let userData = { name: '', phone: '', topic: '' };

    // Tanlangan mavzu bo'yicha 100 ta qiyin DTM testlarini yaratish
    function generate100QuestionsByTopic(topic) {
        let list = [];
        for (let i = 1; i <= 100; i++) {
            let a = Math.floor(Math.random() * 15) + 3;
            let b = Math.floor(Math.random() * 10) + 2;
            let c = Math.floor(Math.random() * 5) + 1;
            
            let qText = "";
            let correct = "";
            let w1 = "", w2 = "", w3 = "";

            switch(topic) {
                case 'chiziqli':
                    qText = `${i}-savol. ${a}x - ${b} = ${a*b + b} chiziqli tenglamani yeching va x ning qiymatini toping.`;
                    correct = `${b + 1}`;
                    w1 = `${b}`; w2 = `${b - 1}`; w3 = `${a}`;
                    break;
                case 'kvadrat':
                    let x1 = a, x2 = b;
                    let p = -(x1 + x2);
                    let q = x1 * x2;
                    qText = `${i}-savol. x^2 + (${p})x + ${q} = 0 kvadrat tenglamaning eng katta ildizini toping.`;
                    correct = `${Math.max(x1, x2)}`;
                    w1 = `${Math.min(x1, x2)}`; w2 = `${x1 + x2}`; w3 = `0`;
                    break;
                case 'foiz':
                    let price = a * 1000;
                    let percent = b * 5;
                    let discount = (price * percent) / 100;
                    qText = `${i}-savol. Do'kondagi ${price} so'mlik mahsulot narxi ${percent}% ga arzonlashdi. Mahsulotning yangi narxini toping.`;
                    correct = `${price - discount} so'm`;
                    w1 = `${price - discount + 500} so'm`; w2 = `${price + discount} so'm`; w3 = `${discount} so'm`;
                    break;
                case 'trigonometriya':
                    qText = `${i}-savol. f(x) = ${a}·sin(${b}x) + ${c} funksiyaning qiymatlar sohasidagi eng kichik butun qiymatini toping.`;
                    correct = `${-a + c}`;
                    w1 = `${a + c}`; w2 = `${-a}`; w3 = `0`;
                    break;
                case 'matnli':
                    qText = `${i}-savol. Ali bitta ishni ${a} soatda, Vali esa ${a*2} soatda tugatadi. Ular birgalikda ishlasa, ushbu ishni necha soatda tugatishadi?`;
                    correct = `${((a * (a*2)) / (a + (a*2))).toFixed(1)} soat`;
                    w1 = `${(a/2).toFixed(1)} soat`; w2 = `${(a*2).toFixed(1)} soat`; w3 = `${(a+2).toFixed(1)} soat`;
                    break;
                case 'ildiz':
                    let inner = a * a * b;
                    qText = `${i}-savol. Soddalashtiring: √( ${inner} ) / √(${b})`;
                    correct = `${a}`;
                    w1 = `${b}`; w2 = `${a*b}`; w3 = `${Math.sqrt(inner).toFixed(1)}`;
                    break;
                case 'kasrlar':
                    qText = `${i}-savol. Hisoblang: (1/${a} + 1/${b}) ÷ (${a+b}/${a*b})`;
                    correct = `1`;
                    w1 = `0`; w2 = `${a}`; w3 = `${b}`;
                    break;
                case 'algebraik':
                    qText = `${i}-savol. Soddalashtiring: (a^2 - ${b*b}) / (a - ${b}) ifodaning a = ${b+c} dagi qiymatini toping.`;
                    correct = `${2*b + c}`;
                    w1 = `${c}`; w2 = `${b}`; w3 = `${b*c}`;
                    break;
            }

            let options = [correct, w1, w2, w3].sort(() => Math.random() - 0.5);
            list.push({
                id: i,
                q: qText,
                answers: options,
                correctIndex: options.indexOf(correct)
            });
        }
        return list;
    }

    const regForm = document.getElementById('reg-form');
    const authBox = document.getElementById('auth-box');
    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box');
    const userDisplay = document.getElementById('user-display');

    regForm.addEventListener('submit', function(e) {
        e.preventDefault();
